[tox]
skip_missing_interpreters = true
envlist = py313, openapicheck
requires = setuptools >= 65.5.0
           pip >= 22.3
           virtualenv >= 20.16.6

[testenv]
description = run the test driver
deps =
    mock
    pytest
    pytest-asyncio
    pytest-mock
    coverage
    genbadge[coverage]
    pydantic-settings
commands =
    coverage run --source wlanpi_core -m pytest --asyncio-mode=auto {posargs}
    coverage report --show-missing
    coverage xml
    genbadge coverage -i coverage.xml -o coverage.svg

[testenv:lint]
# Installs the package so mypy can resolve the runtime deps it imports
# (fastapi, sqlalchemy, dbus, ...); without them every import is import-not-found.
deps =
    ruff
    mypy>=1.14.1
commands =
    ruff check wlanpi_core tests
    mypy wlanpi_core

[testenv:formatcheck]
description = run the format check toolchain
basepython = python3
skip_install = true
deps =
    ruff
commands =
    ruff format --check wlanpi_core tests

[testenv:format]
description = run the format toolchain
basepython = python3
skip_install = true
deps =
    ruff
commands =
    ruff format wlanpi_core tests

[testenv:openapi]
# Deliberately does NOT install the package: pyproject's own dependencies are
# unpinned, so an ordinary install pulls whatever fastapi/pydantic is newest
# on PyPI that day. The CI freshness check installs from requirements.txt in
# a clean env, and pydantic's JSON-schema output is version-sensitive, so
# regenerating against anything else produces a docs/openapi.json that looks
# fine locally but still fails CI's diff. Pin to the same lock file CI uses.
description = regenerate docs/openapi.json against the exact deps CI checks against
basepython = python3.13
skip_install = true
deps = -r requirements.txt
commands =
    python scripts/export_openapi.py

[testenv:openapicheck]
description = fail if docs/openapi.json is stale, without writing to the working tree
basepython = python3.13
skip_install = true
allowlist_externals = git
deps = {[testenv:openapi]deps}
commands =
    python scripts/export_openapi.py
    git diff --exit-code docs/openapi.json