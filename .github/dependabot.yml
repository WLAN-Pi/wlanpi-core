version: 2
registries:
  piwheels:
    type: python-index
    url: https://www.piwheels.org/simple
updates:
  - package-ecosystem: "pip"
    directory: "/"
    registries:
      - piwheels
    # A registries entry disables external code execution. Pip then refuses
    # to parse manifests (unexpected_external_code).
    # https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference#insecure-external-code-execution
    insecure-external-code-execution: allow
    schedule: 
      interval: "weekly"
    allow:
      - dependency-name: fastapi
      - dependency-name: httpx
      - dependency-name: Jinja2
      - dependency-name: aiofiles
      - dependency-name: gunicorn
      - dependency-name: uvicorn
      - dependency-name: python-dotenv
      - dependency-name: pydantic-settings
      - dependency-name: requests
      - dependency-name: psutil
      - dependency-name: PyGObject
    ignore:
      - dependency-name: dbus-python
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
