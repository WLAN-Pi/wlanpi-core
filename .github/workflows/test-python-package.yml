# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Run Python Tests

on:
  # Allow manual runs of workflow from Actions tab
  workflow_dispatch:

  push:
    paths-ignore: # ignore files that don't change build output
      - '**.md'
      - .github/dependabot.yml
      - .gitignore
      - LICENSE
  pull_request:
    paths-ignore: # ignore files that don't change build output
      - '**.md'
      - .github/dependabot.yml
      - .gitignore
      - LICENSE

jobs:
  python:
    name: Python Tests
    runs-on: "ubuntu-26.04"

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"

    - name: Install depends
      run: |
        sudo apt update
        sudo apt install build-essential git unzip zip nload tree ufw nftables vlan sqlite3 lldpd xxd dbus pkg-config gcc libpq-dev libdbus-glib-1-dev libglib2.0-dev cmake libdbus-1-dev python3-pip python3-dev python3-venv python3-wheel python3-setuptools
        sudo apt remove -y meson
        python -m ensurepip --upgrade
        python -m venv venv
        source venv/bin/activate
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install --upgrade "tox<4.26" "genbadge[coverage]"
        if [ -f requirements.txt ]; then
            grep -v "dbus-python" requirements.txt > requirements_ci.txt
            pip install -r requirements_ci.txt
        fi
  
    - name: Run tests with tox
      id: tox-run
      run: |
        source venv/bin/activate
        tox

  nginx-tls:
    name: nginx TLS config validation
    runs-on: "ubuntu-26.04"

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install nginx and openssl
      run: |
        sudo apt-get update -q
        sudo apt-get install -y nginx-light openssl

    - name: Generate temporary certificate
      run: |
        sudo mkdir -p /etc/nginx/ssl
        sudo openssl req -x509 -newkey rsa:2048 -nodes \
          -keyout /etc/nginx/ssl/self-signed-wlanpi.key \
          -out /etc/nginx/ssl/self-signed-wlanpi.cert \
          -days 1 -subj "/CN=localhost" \
          -addext "subjectAltName=IP:127.0.0.1,DNS:localhost"

    - name: Link site configuration
      run: |
        sudo mkdir -p /var/log/wlanpi_core
        sudo rm -f /etc/nginx/sites-enabled/default
        sudo ln -sf "$PWD/install/etc/wlanpi-core/nginx/wlanpi_core.conf" \
          /etc/nginx/sites-enabled/wlanpi_core.conf

    - name: Validate nginx configuration
      run: sudo nginx -t

  slack-workflow-status:
    if: ${{ always() && (github.repository_owner == 'WLAN-Pi') && (! github.event.pull_request.head.repo.fork) }}
    name: Post Workflow Status to Slack
    needs:
      - python
      - nginx-tls
    runs-on: "ubuntu-26.04"
    steps:
      - name: Slack Workflow Notification
        uses: Gamesight/slack-workflow-status@master
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
