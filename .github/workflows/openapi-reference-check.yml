name: OpenAPI Reference Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  check:
    if: github.repository_owner == 'WLAN-Pi'
    name: OpenAPI reference is current
    runs-on: "${{ vars.RUNS_ON || 'ubuntu-26.04' }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libdbus-1-dev \
            libdbus-glib-1-dev \
            libglib2.0-dev \
            pkg-config

      - name: Install tox
        run: |
          python -m ensurepip --upgrade
          python -m pip install --upgrade "tox>=4"

      - name: Verify docs/openapi.json matches the generated schema
        run: |
          if ! tox -e openapicheck; then
            echo "::error::docs/openapi.json is stale. Run 'tox -e openapi' and commit the result in this PR."
            exit 1
          fi

  discord-workflow-status:
    if: ${{ always() && github.repository_owner == 'WLAN-Pi' && ! github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]' }}
    name: Post Workflow Status to Discord
    needs:
      - check
    uses: WLAN-Pi/gh-workflows/.github/workflows/discord-workflow-status.yml@main
    permissions:
      actions: read
      contents: read
    with:
      parent_run_id: ${{ github.run_id }}
    secrets: inherit
