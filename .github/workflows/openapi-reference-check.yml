name: OpenAPI Reference Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read
  actions: read

jobs:
  check:
    if: github.repository_owner == 'WLAN-Pi'
    name: OpenAPI reference is current
    runs-on: "${{ vars.RUNS_ON || 'ubuntu-26.04' }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libdbus-1-dev \
            libdbus-glib-1-dev \
            libglib2.0-dev \
            pkg-config

      - name: Install tox
        run: |
          python -m ensurepip --upgrade
          python -m pip install --upgrade "tox>=4"

      - name: Verify docs/openapi.json matches the generated schema
        run: |
          if ! tox -e openapicheck; then
            echo "::error::docs/openapi.json is stale. Run 'tox -e openapi' and commit the result in this PR, or (if this PR targets main) merge the open 'chore: update generated OpenAPI reference' PR into dev first."
            exit 1
          fi

  slack-workflow-status:
    if: ${{ always() && (github.repository_owner == 'WLAN-Pi') && (! github.event.pull_request.head.repo.fork) }}
    name: Post Workflow Status to Slack
    needs:
      - check
    runs-on: 'ubuntu-26.04'
    steps:
      - name: Slack Workflow Notification
        uses: Gamesight/slack-workflow-status@2e709ce51fd47f02b7221db8547e6e6f49f81f1d # v2.0.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
