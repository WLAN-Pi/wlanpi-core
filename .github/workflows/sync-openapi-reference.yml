name: Sync OpenAPI Reference

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches:
      - dev
    paths:
      - "wlanpi_core/**"
      - "requirements.txt"
      - "scripts/export_openapi.py"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: openapi-reference-sync
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.repository_owner == 'WLAN-Pi'
    runs-on: "${{ vars.RUNS_ON || 'ubuntu-24.04' }}"

    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libdbus-1-dev \
            libdbus-glib-1-dev \
            libglib2.0-dev \
            pkg-config

      - name: Install locked Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --requirement requirements.txt

      - name: Regenerate OpenAPI reference
        run: python scripts/export_openapi.py

      - name: Open or update OpenAPI reference PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          base: dev
          branch: automation/openapi-reference
          delete-branch: true
          add-paths: docs/openapi.json
          commit-message: Update generated OpenAPI reference
          title: "chore: update generated OpenAPI reference"
          body: |
            `docs/openapi.json` differed from the schema generated by
            `scripts/export_openapi.py` on Python 3.13.

            This pull request is maintained automatically. The live appliance
            schema remains available at `/api/v1/openapi.json`.
