name: Sync OpenAPI Reference

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches:
      - dev
    paths:
      - "wlanpi_core/**"
      - "requirements.txt"
      - "scripts/export_openapi.py"
      - ".github/workflows/sync-openapi-reference.yml"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: openapi-reference-sync
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.repository_owner == 'WLAN-Pi'
    runs-on: "${{ vars.RUNS_ON || 'ubuntu-26.04' }}"
    timeout-minutes: 30

    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libdbus-1-dev \
            libdbus-glib-1-dev \
            libglib2.0-dev \
            pkg-config

      - name: Install tox
        run: |
          python -m ensurepip --upgrade
          python -m pip install --upgrade "tox>=4"

      - name: Regenerate OpenAPI reference
        run: tox -e openapi

      - name: Open or update OpenAPI reference PR
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          base: dev
          branch: automation/openapi-reference
          delete-branch: true
          add-paths: docs/openapi.json
          commit-message: Update generated OpenAPI reference
          title: "chore: update generated OpenAPI reference"
          body: |
            `docs/openapi.json` differed from the schema generated by
            `scripts/export_openapi.py` on Python 3.13.

            This pull request is maintained automatically. wlanpi-core also
            serves the current schema at `/api/v1/openapi.json`.

      # A PR created with GITHUB_TOKEN gets its pull_request runs gated as
      # action_required. Approve them so the required checks execute against
      # the PR head. No stored token is used.
      - name: Approve the required checks on the automation branch
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          repo="${{ github.repository }}"
          pr="${{ steps.cpr.outputs.pull-request-number }}"
          sha=$(gh pr view "$pr" --repo "$repo" --json headRefOid -q .headRefOid)
          for _ in $(seq 1 30); do
            pending=$(gh api "repos/$repo/actions/runs?head_sha=$sha&per_page=100" \
              -q '[.workflow_runs[] | select(.conclusion == "action_required")] | length')
            if [ "$pending" -gt 0 ]; then
              break
            fi
            sleep 10
          done
          for id in $(gh api "repos/$repo/actions/runs?head_sha=$sha&per_page=100" \
            -q '.workflow_runs[] | select(.conclusion == "action_required") | .id'); do
            echo "Approving run $id"
            gh api -X POST "repos/$repo/actions/runs/$id/approve"
          done

      # Merge only when the checks pass. A failed check leaves the PR open for
      # review. No stored token is used: the run's GITHUB_TOKEN is ephemeral.
      - name: Merge the OpenAPI reference PR when the checks pass
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          pr="${{ steps.cpr.outputs.pull-request-number }}"
          repo="${{ github.repository }}"
          for _ in $(seq 1 30); do
            count=$(gh pr view "$pr" --repo "$repo" \
              --json statusCheckRollup -q '.statusCheckRollup | length')
            if [ "$count" -gt 0 ]; then
              break
            fi
            sleep 10
          done
          gh pr checks "$pr" --repo "$repo" --watch --fail-fast
          gh pr merge "$pr" --repo "$repo" --squash --delete-branch

  slack-workflow-status:
    if: ${{ always() && (github.repository_owner == 'WLAN-Pi') && (! github.event.pull_request.head.repo.fork) }}
    name: Post Workflow Status to Slack
    needs:
      - regenerate
    runs-on: 'ubuntu-26.04'
    steps:
      - name: Slack Workflow Notification
        uses: Gamesight/slack-workflow-status@master
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
