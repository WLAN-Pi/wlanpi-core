# Shipped by wlanpi-core.
# lldpd receives CDP only when started with -c; wlanpi-core reads both LLDP
# and CDP neighbours from lldpd via lldpctl for /api/v1/network/info.
# LLDPD_OPTIONS is used (not DAEMON_ARGS) so an admin-set DAEMON_ARGS in
# /etc/default/lldpd still composes with this instead of clobbering it.
[Service]
Environment=LLDPD_OPTIONS=-c
