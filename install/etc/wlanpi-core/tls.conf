# wlanpi-core TLS front-ends (feature flags).
#
# Both are OFF by default: installing this file changes nothing. Flip a flag
# and run `sudo wlanpi-core-tls apply`, or use `sudo wlanpi-core-tls enable api`
# / `enable mcp` which edits this file and applies in one step.
#
# Each front-end is an nginx listener using the device's self-signed cert
# (generated by wlanpi-core's postinst, /etc/nginx/ssl/self-signed-wlanpi.*).
# Clients must trust that cert (or pin it); see docs/TLS.md.

# HTTPS for the wlanpi-core API on :31416. Plain HTTP on :31415 stays up
# regardless, so existing clients keep working while they migrate.
WLANPI_CORE_TLS_API=0

# HTTPS front for wlanpi-mcp on :8767, proxying to the MCP daemon on
# 127.0.0.1:8766. When enabled, bind the MCP daemon to loopback so the
# cleartext port is not reachable from the LAN (WLANPI_MCP_HOST=127.0.0.1 in
# /etc/wlanpi-mcp/config.env) and do not open 8766 in the firewall.
WLANPI_CORE_TLS_MCP=0

# Development only: HTTPS on :8443 in front of a dev core instance started
# with `sudo venv/bin/python -m wlanpi_core --debug --reload` (uvicorn on
# 127.0.0.1:8000). Leave off on deployed devices.
WLANPI_CORE_TLS_DEV=0
