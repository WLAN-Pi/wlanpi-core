# HTTPS front-end for a DEVELOPMENT core instance (feature-flagged).
#
# Linked into /etc/nginx/sites-enabled by `wlanpi-core-tls apply` only when
# WLANPI_CORE_TLS_DEV=1 in /etc/wlanpi-core/tls.conf. Proxies to the uvicorn
# dev server started with
#
#     sudo venv/bin/python -m wlanpi_core --debug --reload
#
# which listens on 0.0.0.0:8000 (the --port default). Run the dev server on a
# different port and this site needs the proxy_pass target changed to match.
#
# Identical to wlanpi_core_tls.conf apart from the listener and upstream, so
# what you test here is the same TLS/proxy behaviour the production site has.
# Relies on the `json_combined` log_format declared in wlanpi_core.conf.

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/self-signed-wlanpi.cert;
    ssl_certificate_key /etc/nginx/ssl/self-signed-wlanpi.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:wlanpi_core_tls_dev:1m;
    ssl_session_timeout 1d;

    access_log /var/log/wlanpi_core/nginx_dev_access.log json_combined;
    error_log /var/log/wlanpi_core/nginx_dev_error.log;

    # Packet-capture WebSocket over TLS: dedicated location, so the
    # Connection header is the nginx-documented hardcoded "upgrade" (no map
    # needed for a WS-only path). Long-lived, unbuffered streaming.
    location /api/v1/streaming/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
        # forward application requests to the uvicorn dev server
        proxy_pass http://127.0.0.1:8000;
    }
}
