map $request_body $request_body_json {
    default $request_body;
    ""      "null";
}

# Clients that present their own wlanpi-core JWT (e.g. wlanpi-mcp) tag their
# requests so nginx forwards a non-loopback X-Real-IP. That routes them to
# core's JWT validator instead of the localhost HMAC path, which needs the
# root-owned shared secret an unprivileged on-box service cannot read. This is
# opt-in only: the JWT is still required and validated by core, so it can never
# bypass auth, only demand a token where HMAC would otherwise apply.
map $http_x_wlanpi_client $wlanpi_real_ip {
    default   $remote_addr;
    "mcp"     192.0.2.1;   # RFC 5737 TEST-NET-1 sentinel (non-loopback)
}

# WebSocket upgrade: map the client's Upgrade header to the right Connection
# value so `location /api/v1/streaming/` can proxy the capture WebSocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

log_format json_combined escape=json
    '{'
    '"timestamp":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"remote_user":"$remote_user",'
    '"request":"$request",'
    '"status": "$status",'
    '"body_bytes_sent":"$body_bytes_sent",'
    '"request_time":"$request_time",'
    '"http_referrer":"$http_referer",'
    '"http_user_agent":"$http_user_agent",'
    '"request_body":$request_body_json'
    '}';

server {
    listen 31415;
    server_name _;

    access_log /var/log/wlanpi_core/nginx_access.log json_combined;
    error_log /var/log/wlanpi_core/nginx_error.log;

    # Packet-capture WebSocket: needs HTTP/1.1 upgrade and long-lived,
    # unbuffered streaming. X-Real-IP is the true client here (the WS
    # authenticates via a first-message token, not the HMAC/JWT IP dispatch).
    location /api/v1/streaming/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_pass http://unix:/run/wlanpi_core.sock;
    }

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $wlanpi_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
        # forward application requests to the gunicorn server
        proxy_pass http://unix:/run/wlanpi_core.sock;
    }
}