# HTTPS front-end for wlanpi-mcp (feature-flagged).
#
# Linked into /etc/nginx/sites-enabled by `wlanpi-core-tls apply` only when
# WLANPI_CORE_TLS_MCP=1 in /etc/wlanpi-core/tls.conf. Terminates TLS with the
# device cert and proxies to the MCP daemon on loopback. nginx does TLS and
# proxying only: MCP authentication stays in wlanpi-mcp / wlanpi-core.
#
# When this is enabled, the MCP daemon should bind to 127.0.0.1 so the
# cleartext port is not reachable from the LAN (WLANPI_MCP_HOST in
# /etc/wlanpi-mcp/config.env), and 8766 must not be opened in the firewall.
#
# Relies on the `json_combined` log_format declared in wlanpi_core.conf.

server {
    listen 8767 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/self-signed-wlanpi.cert;
    ssl_certificate_key /etc/nginx/ssl/self-signed-wlanpi.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:wlanpi_mcp_tls:1m;
    ssl_session_timeout 1d;

    access_log /var/log/wlanpi_core/nginx_mcp_access.log json_combined;
    error_log /var/log/wlanpi_core/nginx_mcp_error.log;

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE (legacy transport) and Streamable HTTP both stream responses:
        # keep the upstream connection open and never buffer.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_redirect off;
        proxy_pass http://127.0.0.1:8766;
    }
}
