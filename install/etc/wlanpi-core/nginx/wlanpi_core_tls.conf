# HTTPS front-end for the wlanpi-core API (feature-flagged).
#
# Linked into /etc/nginx/sites-enabled by `wlanpi-core-tls apply` only when
# WLANPI_CORE_TLS_API=1 in /etc/wlanpi-core/tls.conf. Plain HTTP on :31415
# (wlanpi_core.conf) stays up during the client transition window, so this
# listener uses its own port rather than taking :31415 over.
#
# Relies on the `json_combined` log_format declared in wlanpi_core.conf, which
# nginx loads first (sites-enabled/*.conf is included in name order).
#
# The location block mirrors wlanpi_core.conf on purpose; the test suite
# (tests/test_nginx_tls_config.py) fails if the two drift.

server {
    listen 31416 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/self-signed-wlanpi.cert;
    ssl_certificate_key /etc/nginx/ssl/self-signed-wlanpi.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:wlanpi_core_tls:1m;
    ssl_session_timeout 1d;

    access_log /var/log/wlanpi_core/nginx_access.log json_combined;
    error_log /var/log/wlanpi_core/nginx_error.log;

    # Packet-capture WebSocket over TLS: dedicated location, so the
    # Connection header is the nginx-documented hardcoded "upgrade" (no map
    # needed for a WS-only path). Long-lived, unbuffered streaming.
    location /api/v1/streaming/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_pass http://unix:/run/wlanpi_core.sock;
    }

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
        # forward application requests to the gunicorn server
        proxy_pass http://unix:/run/wlanpi_core.sock;
    }
}
