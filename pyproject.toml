[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wlanpi-core"
description = "backend services for the WLAN Pi"
requires-python = ">=3.13"
dynamic = ["version"]
authors = [
    {name = "Josh Schmelzle", email = "josh@joshschmelzle.com"},
]
classifiers = [
    "Natural Language :: English",
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: System Administrators",
    "Topic :: Utilities",
]
dependencies = [
    "fastapi",
    "httpx",
    "Jinja2",
    "aiofiles",
    "gunicorn",
    "uvicorn",
    "python-dotenv",
    "pydantic-settings",
    "requests",
    "slowapi",
    "Authlib",
    "aiosqlite",
    "sqlalchemy[asyncio]",
    "alembic",
    "websockets",
    "psutil",
    "dbus-python",
]

[project.license]
text = "BSD-3-Clause"

[project.optional-dependencies]
testing = [
    "tox",
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "genbadge[coverage]",
    "pytest-mock",
    "pydantic-settings",
]

[project.urls]
Documentation = "https://docs.wlanpi.com"
Source = "https://github.com/wlan-pi/wlanpi-core"

[project.scripts]
getjwt = "wlanpi_core.cli.getjwt:main"
networkcfg = "wlanpi_core.cli.network_config:main"
wlanpi-techsupport = "wlanpi_core.cli.techsupport:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["wlanpi_core*"]
exclude = ["tests*"]

[tool.setuptools.dynamic]
version = {attr = "wlanpi_core.__version__.__version__"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# D rules: FastAPI serves each endpoint's __doc__ as its OpenAPI description.
select = [
    "E", "W", "F", "I", "B", "BLE", "C4", "UP", "RUF",
    "D100", "D101", "D102", "D103", "D104", "D105", "D106",
    "D200", "D205", "D209", "D401", "D415",
]
# E501: ruff format owns line length. BLE001: boundaries catch Exception and return 500/503.
ignore = ["E501", "BLE001"]

[tool.ruff.lint.per-file-ignores]
# test_* names self-describe.
"tests/**" = ["D100", "D101", "D102", "D103", "D104"]
# __init__ files are re-export shims.
"wlanpi_core/**/__init__.py" = ["F401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["wlanpi_core"]
